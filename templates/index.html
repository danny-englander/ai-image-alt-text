<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image Caption</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f7f8;
      --panel: #ffffff;
      --border: #ddd;
      --text: #1a1a1a;
      --muted: #666;
      --accent: #2563eb;
      --ok: #16a34a;
      --err: #dc2626;
      --skip: #a16207;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 2rem 1rem 4rem;
    }
    main { max-width: 900px; margin: 0 auto; }
    h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }
    p.sub { color: var(--muted); margin-top: 0; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.5rem;
    }
    label { display: block; font-weight: 600; margin-bottom: 0.35rem; }
    .field { margin-bottom: 1.1rem; }
    input[type="text"], select {
      width: 100%;
      padding: 0.5rem 0.6rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
      background: var(--panel);
      color: var(--text);
    }
    input[type="file"] { width: 100%; }
    .radio-row { display: flex; gap: 1.25rem; flex-wrap: wrap; }
    .radio-row label, .checkbox-row label {
      font-weight: 400;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      margin: 0;
    }
    .hint { color: var(--muted); font-size: 0.85rem; margin-top: 0.3rem; }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 0.6rem 1.2rem;
      font-size: 0.95rem;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
    #error { color: var(--err); margin-top: 0.75rem; display: none; }
    #progress-panel, #results-panel { display: none; }
    progress { width: 100%; height: 10px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; }
    .status-written { color: var(--ok); font-weight: 600; }
    .status-skipped { color: var(--skip); font-weight: 600; }
    .status-error { color: var(--err); font-weight: 600; }
    .actions { display: flex; gap: 0.75rem; align-items: center; margin-top: 1rem; }
  </style>
</head>
<body>
<main>
  <h1>Image Caption</h1>
  <p class="sub">Bulk-generate alt text (and optional IPTC metadata) for a batch of images.</p>

  <form id="upload-form" class="panel" enctype="multipart/form-data">
    <div class="field">
      <label for="images">Images</label>
      <input type="file" id="images" name="images" multiple
             accept=".jpg,.jpeg,.png,.gif,.heic,.webp" required>
    </div>

    <div class="field">
      <label for="model">Model</label>
      <select id="model" name="model">
        {% for m in models %}
        <option value="{{ m.name }}"
          {% if m.name == default_model %}selected{% endif %}
          {% if not m.installed %}disabled{% endif %}>
          {{ m.name }} — {{ m.description }}{% if not m.installed %} (not installed){% endif %}
        </option>
        {% endfor %}
      </select>
    </div>

    <div class="field">
      <label for="context">Context <span class="hint" style="font-weight:400;">(optional)</span></label>
      <input type="text" id="context" name="context"
             placeholder="e.g. Cherry blossoms at Japanese Friendship Garden">
    </div>

    <div class="field">
      <label>Mode</label>
      <div class="radio-row">
        <label><input type="radio" name="mode" value="alt" checked> Alt text only</label>
        <label><input type="radio" name="mode" value="iptc"> Alt text + IPTC (Title, Description, Keywords)</label>
        <label><input type="radio" name="mode" value="title_only"> Title only</label>
      </div>
    </div>

    <div class="field checkbox-row">
      <label><input type="checkbox" name="force"> Overwrite existing alt text</label>
    </div>

    <button type="submit" id="submit-btn">Upload &amp; Process</button>
    <div id="error"></div>
  </form>

  <div class="panel" id="progress-panel">
    <p id="progress-label">Processing 0 / 0…</p>
    <progress id="progress-bar" value="0" max="1"></progress>
  </div>

  <div class="panel" id="results-panel">
    <h2 style="font-size:1.1rem;">Results</h2>
    <table>
      <thead>
        <tr><th>File</th><th>Status</th><th>Alt text / Title</th><th>Details</th></tr>
      </thead>
      <tbody id="results-body"></tbody>
    </table>
    <div class="actions">
      <a id="download-link" href="#" style="display:none;"><button type="button">Download tagged images (.zip)</button></a>
      <button type="button" class="secondary" id="reset-btn">Start a new batch</button>
    </div>
  </div>
</main>

<script>
const form = document.getElementById("upload-form");
const errorBox = document.getElementById("error");
const submitBtn = document.getElementById("submit-btn");
const progressPanel = document.getElementById("progress-panel");
const progressLabel = document.getElementById("progress-label");
const progressBar = document.getElementById("progress-bar");
const resultsPanel = document.getElementById("results-panel");
const resultsBody = document.getElementById("results-body");
const downloadLink = document.getElementById("download-link");
const resetBtn = document.getElementById("reset-btn");

let pollTimer = null;

function escapeHtml(s) {
  const div = document.createElement("div");
  div.textContent = s ?? "";
  return div.innerHTML;
}

function renderResults(results) {
  resultsBody.innerHTML = results.map(r => {
    const headline = r.title || r.alt || "";
    const details = [r.description, r.keywords].filter(Boolean).join(" | ") || r.message || "";
    return `<tr>
      <td>${escapeHtml(r.filename)}</td>
      <td class="status-${r.status}">${escapeHtml(r.status)}</td>
      <td>${escapeHtml(headline)}</td>
      <td>${escapeHtml(details)}</td>
    </tr>`;
  }).join("");
}

async function poll(jobId) {
  const res = await fetch(`/jobs/${jobId}/status`);
  if (!res.ok) {
    clearInterval(pollTimer);
    errorBox.style.display = "block";
    errorBox.textContent = "Lost track of the job. Please try again.";
    return;
  }
  const job = await res.json();
  progressLabel.textContent = `Processing ${job.done} / ${job.total}…`;
  progressBar.value = job.total ? job.done / job.total : 0;
  resultsPanel.style.display = "block";
  renderResults(job.results);

  if (job.state === "done") {
    clearInterval(pollTimer);
    progressLabel.textContent = `Done: ${job.done} / ${job.total}`;
    downloadLink.href = `/jobs/${jobId}/download`;
    downloadLink.style.display = "inline-block";
  }
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  errorBox.style.display = "none";
  submitBtn.disabled = true;

  const data = new FormData(form);
  try {
    const res = await fetch("/jobs", { method: "POST", body: data });
    const body = await res.json();
    if (!res.ok) {
      throw new Error(body.error || "Upload failed.");
    }
    progressPanel.style.display = "block";
    progressLabel.textContent = "Processing…";
    progressBar.value = 0;
    downloadLink.style.display = "none";
    pollTimer = setInterval(() => poll(body.job_id), 1500);
    poll(body.job_id);
  } catch (err) {
    errorBox.style.display = "block";
    errorBox.textContent = err.message;
    submitBtn.disabled = false;
  }
});

resetBtn.addEventListener("click", () => {
  window.location.reload();
});
</script>
</body>
</html>
